<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elevator to Hell</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #d8c9a0; font-family: "Courier New", monospace; }
    #game { width: 100%; height: 100%; display: block; outline: none; image-rendering: crisp-edges; image-rendering: pixelated; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; background: #e8e0c0; box-shadow: 0 0 0 1px #000; }
    #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(0, 0, 0, .78); cursor: pointer; text-align: center; }
    #overlay h1 { margin: 0; font-size: 40px; letter-spacing: 4px; color: #c9482b; }
    #overlay p { margin: 0; font-size: 16px; line-height: 1.5; }
    #hint { position: fixed; left: 50%; top: 56%; transform: translateX(-50%); padding: 4px 10px; background: rgba(0, 0, 0, .65); font-size: 18px; color: #ffd060; pointer-events: none; }
    #toast { position: fixed; left: 50%; top: 12%; transform: translateX(-50%); padding: 8px 16px; background: rgba(0, 0, 0, .75); border: 2px solid #c9482b; font-size: 20px; text-align: center; pointer-events: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crosshair" class="hidden"></div>
  <div id="hint" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <div id="overlay">
    <h1>ELEVATOR TO HELL</h1>
    <p>Кликните, чтобы начать</p>
    <p>WASD — движение, мышь — обзор, E — нажать кнопку, Esc — пауза</p>
    <p>Этап 2: лифт и вес</p>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
